<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Pathtools 2e — ficha e compêndio local de Pathfinder 2e Remaster em português."
    />
    <meta name="theme-color" content="#0a0c10" />
    <title>Pathtools 2e</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('sp-theme-preference') || 'system'
          var light =
            pref === 'light' ||
            (pref !== 'dark' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
