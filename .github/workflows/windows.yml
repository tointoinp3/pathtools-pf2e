name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Pathtools 2e v__VERSION__'
          releaseBody: |
            Instalador Windows. Não precisa do Node nem do navegador.

            Se aparecer “O Windows protegeu o seu PC”: Mais informações → Executar mesmo assim.

            Fichas ficam neste PC. Para copiar a outro aparelho, use exportar / importar JSON no app.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
